 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In / Sign Up</title>
  <link rel="stylesheet" href="sign.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

<div class="container" id="container">

  <div class="separator">
    <div class="separator-inner"></div>
  </div>

  <!-- Sign Up -->
  <div class="form-container sign-up-container">
    <form id="signUpForm">
      <h1>Create Account</h1>
      <input type="text" placeholder="Name" required />
      <input type="email" placeholder="Email" required />

      <div class="password-field">
        <input type="password" id="signUpPassword" placeholder="Password" required />
        <i class="fas fa-eye toggle-password" toggle="#signUpPassword"></i>
      </div>

      <div class="password-field">
        <input type="password" id="signUpConfirmPassword" placeholder="Confirm Password" required />
        <i class="fas fa-eye toggle-password" toggle="#signUpConfirmPassword"></i>
      </div>

      <p id="passwordMismatch" class="message error">Passwords do not match!</p>
      <p id="passwordMatch" class="message success">Passwords match!</p>

      <button type="submit" onclick="alert('Registration Done!')"><a style="color: white; text-decoration: none;" href="Aindex.html">Sign Up</a></button>
    </form>
  </div>

  <!-- Sign In -->
  <div class="form-container sign-in-container">
    <form>
      <h1>Sign in</h1>
      <input type="email" placeholder="Email" required />

      <div class="password-field">
        <input type="password" id="signInPassword" placeholder="Password" required />
        <i class="fas fa-eye toggle-password" toggle="#signInPassword"></i>
      </div>

      <a id="anchor" href="#">Forgot your password?</a>
      <button onclick="alert('You are logging')"> <a style="color: white; text-decoration: none;" href="Aindex.html">Sign In</a> </button>
    </form>
  </div>

  <!-- Overlay -->
  <div class="overlay-container">
    <div class="overlay">
      <div class="overlay-panel overlay-left">
        <h1>Hello Friend!</h1>
        <p>To keep connected, sign in with your info</p>
        <button class="ghost" id="signIn">Sign In</button>
      </div>
      <div class="overlay-panel overlay-right">
        <h1>Welcome to AI-Wardrobe!</h1>
        <p>Enter your details and enjoy virtual dressing</p>
        <button class="ghost" id="signUp">Sign Up</button>
      </div>
    </div>
  </div>

</div>

<script src="sign.js"></script>
</body>
</html>
